<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景圆形渐变 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#FFF" stroke-width="8"/>
  
  <!-- 趣趣 - 小书虫IP（简化版） -->
  <!-- 身体 -->
  <ellipse cx="256" cy="320" rx="80" ry="60" fill="#8BC34A"/>
  
  <!-- 头部 -->
  <circle cx="256" cy="240" r="70" fill="#8BC34A"/>
  
  <!-- 眼睛 -->
  <circle cx="235" cy="225" r="12" fill="#FFF"/>
  <circle cx="277" cy="225" r="12" fill="#FFF"/>
  <circle cx="238" cy="225" r="6" fill="#333"/>
  <circle cx="280" cy="225" r="6" fill="#333"/>
  
  <!-- 嘴巴（微笑） -->
  <path d="M 235 265 Q 256 285 277 265" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- 触角 -->
  <line x1="230" y1="180" x2="220" y2="155" stroke="#558B2F" stroke-width="4" stroke-linecap="round"/>
  <line x1="282" y1="180" x2="292" y2="155" stroke="#558B2F" stroke-width="4" stroke-linecap="round"/>
  <circle cx="220" cy="153" r="6" fill="#558B2F"/>
  <circle cx="292" cy="153" r="6" fill="#558B2F"/>
  
  <!-- 书本（趣趣拿着书） -->
  <rect x="200" y="290" width="112" height="80" rx="5" fill="#FFF" stroke="#333" stroke-width="2"/>
  <line x1="256" y1="290" x2="256" y2="370" stroke="#333" stroke-width="2"/>
  <!-- 书页线条 -->
  <line x1="210" y1="310" x2="250" y2="310" stroke="#4CAF50" stroke-width="2"/>
  <line x1="210" y1="330" x2="250" y2="330" stroke="#4CAF50" stroke-width="2"/>
  <line x1="262" y1="310" x2="300" y2="310" stroke="#4CAF50" stroke-width="2"/>
  <line x1="262" y1="330" x2="300" y2="330" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- 汉字「字」（书本上方） -->
  <text x="256" y="210" font-size="36" font-weight="bold" fill="#FFF" text-anchor="middle" font-family="Arial, sans-serif">字</text>
</svg>
