<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 667" width="375" height="667">
  <!-- 登录页背景插画 -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE082;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景渐变 -->
  <rect width="375" height="667" fill="url(#bg-grad)"/>
  
  <!-- 装饰云朵 -->
  <ellipse cx="80" cy="100" rx="40" ry="25" fill="white" opacity="0.6"/>
  <ellipse cx="375" cy="120" rx="50" ry="30" fill="white" opacity="0.5"/>
  <ellipse cx="280" cy="80" rx="35" ry="20" fill="white" opacity="0.7"/>
  
  <!-- 趣趣IP形象（小书虫） -->
  <ellipse cx="187.5" cy="350" rx="60" ry="80" fill="#4CAF50"/>
  <circle cx="187.5" cy="280" r="45" fill="#4CAF50"/>
  <circle cx="170" cy="270" r="8" fill="white"/>
  <circle cx="205" cy="270" r="8" fill="white"/>
  <circle cx="170" cy="270" r="4" fill="black"/>
  <circle cx="205" cy="270" r="4" fill="black"/>
  <ellipse cx="187.5" cy="295" rx="12" ry="8" fill="#388E3C"/>
  <path d="M170 310c0-10 35-10 35 0" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- 装饰书本 -->
  <rect x="100" y="450" width="40" height="50" rx="3" fill="#2196F3" transform="rotate(-15 120 475)"/>
  <rect x="235" y="460" width="40" height="50" rx="3" fill="#FF5252" transform="rotate(10 255 485)"/>
  <rect x="150" y="500" width="40" height="50" rx="3" fill="#9C27B0" transform="rotate(-5 170 525)"/>
  
  <!-- 标题区域（占位） -->
  <rect x="87.5" y="550" width="200" height="60" rx="10" fill="white" opacity="0.9"/>
</svg>