<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- 空状态插画 - 无学习记录 -->
  <rect width="300" height="200" fill="#F5F5F5" rx="10"/>
  
  <!-- 趣趣IP形象（思考表情） -->
  <ellipse cx="150" cy="90" rx="35" ry="45" fill="#4CAF50"/>
  <circle cx="140" cy="80" r="5" fill="white"/>
  <circle cx="160" cy="80" r="5" fill="white"/>
  <circle cx="140" cy="80" r="2.5" fill="black"/>
  <circle cx="160" cy="80" r="2.5" fill="black"/>
  <ellipse cx="150" cy="95" rx="6" ry="4" fill="#388E3C"/>
  <path d="M143 102c0-3 14-3 14 0" fill="none" stroke="black" stroke-width="1.5"/>
  
  <!-- 装饰学习元素（半透明） -->
  <rect x="60" y="60" width="25" height="35" rx="2" fill="#2196F3" opacity="0.3"/>
  <rect x="110" y="70" width="25" height="35" rx="2" fill="#FF9800" opacity="0.3"/>
  <rect x="165" y="70" width="25" height="35" rx="2" fill="#FF5252" opacity="0.3"/>
  <rect x="215" y="60" width="25" height="35" rx="2" fill="#9C27B0" opacity="0.3"/>
  
  <!-- 提示文字占位 -->
  <rect x="100" y="160" width="100" height="16" rx="4" fill="white" opacity="0.8"/>
</svg>