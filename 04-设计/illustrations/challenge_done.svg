  <circle cx="140" cy="80" r="5" fill="white"/>
  <circle cx="160" cy="80" r="5" fill="white"/>
  <circle cx="140" cy="80" r="2.5" fill="black"/>
  <circle cx="160" cy="80" r="2.5" fill="black"/>
  <ellipse cx="150" cy="95" rx="6" ry="4" fill="#388E3C"/>
  <path d="M143 102c0-5 14-5 14 0" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- 庆祝手势 -->
  <path d="M100 70c-10-15-25-15-30 0" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 70c10-15 25-15 30 0" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 装饰星星 -->
