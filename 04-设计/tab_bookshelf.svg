<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Tab 3: 书架 (Bookshelf) -->
  <g id="tab-bookshelf">
    <!-- 书架框 -->
    <rect x="4" y="6" width="40" height="36" rx="2" fill="none" stroke="#9E9E9E" stroke-width="2"/>
    <!-- 横板 -->
    <line x1="4" y1="18" x2="44" y2="18" stroke="#9E9E9E" stroke-width="2"/>
    <line x1="4" y1="30" x2="44" y2="30" stroke="#9E9E9E" stroke-width="2"/>
    <!-- 第一层书 -->
    <rect x="8" y="10" width="6" height="6" fill="#9E9E9E"/>
    <rect x="16" y="8" width="5" height="8" fill="#9E9E9E"/>
    <rect x="23" y="11" width="7" height="5" fill="#9E9E9E"/>
    <rect x="32" y="9" width="4" height="7" fill="#9E9E9E"/>
    <!-- 第二层书 -->
    <rect x="7" y="21" width="7" height="7" fill="#9E9E9E"/>
    <rect x="16" y="23" width="6" height="5" fill="#9E9E9E"/>
    <rect x="24" y="20" width="5" height="8" fill="#9E9E9E"/>
    <rect x="31" y="22" width="7" height="6" fill="#9E9E9E"/>
    <!-- 第三层书 -->
    <rect x="9" y="33" width="5" height="7" fill="#9E9E9E"/>
    <rect x="16" y="35" width="7" height="5" fill="#9E9E9E"/>
    <rect x="25" y="32" width="6" height="8" fill="#9E9E9E"/>
    <rect x="33" y="34" width="5" height="6" fill="#9E9E9E"/>
  </g>
</svg>