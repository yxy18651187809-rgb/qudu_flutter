<?xml version="1.0" encoding="UTF-8"?>
<!-- 趣趣 Qùqu - 眨眼表情 -->
<!-- 使用场景：鼓励、加油打气、互动反馈 -->
<svg viewBox="0 0 160 210" xmlns="http://www.w3.org/2000/svg">
  <!-- 身体节3 -->
  <ellipse cx="80" cy="180" rx="22" ry="18" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节2 -->
  <ellipse cx="80" cy="150" rx="28" ry="22" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节1（侧身，眨眼时侧身） -->
  <ellipse cx="82" cy="116" rx="32" ry="26" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 尾巴（轻轻摆动） -->
  <path d="M82 195 Q92 208 82 218 Q72 208 82 195" fill="#A5C487"/>
  <!-- 腹部高光 -->
  <ellipse cx="82" cy="180" rx="12" ry="9" fill="#FFF8E1" opacity="0.85"/>
  <ellipse cx="82" cy="150" rx="17" ry="13" fill="#FFF8E1" opacity="0.85"/>
  <ellipse cx="82" cy="116" rx="20" ry="15" fill="#FFF8E1" opacity="0.85"/>
  <!-- 手（左侧，竖起大拇指） -->
  <circle cx="42" cy="112" r="11" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 手（右侧，持书） -->
  <circle cx="122" cy="112" r="11" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 书 -->
  <rect x="118" y="94" width="28" height="22" rx="4" fill="#FF8A65" stroke="#E64A19" stroke-width="1.5"/>
  <line x1="132" y1="94" x2="132" y2="116" stroke="#E64A19" stroke-width="1.5"/>
  <!-- 头部（略侧身） -->
  <ellipse cx="82" cy="68" rx="42" ry="38" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 头顶叶子（调皮摆动） -->
  <ellipse cx="82" cy="30" rx="13" ry="20" fill="#8BC34A" stroke="#689F38" stroke-width="1.5" transform="rotate(-18,82,30)"/>
  <line x1="82" y1="36" x2="82" y2="50" stroke="#689F38" stroke-width="2" transform="rotate(-18,82,36)"/>
  <!-- 腮红（略红） -->
  <ellipse cx="50" cy="80" rx="13" ry="10" fill="#FFAB91" opacity="0.65"/>
  <ellipse cx="114" cy="80" rx="13" ry="10" fill="#FFAB91" opacity="0.65"/>
  <!-- 左眼（正常睁开） -->
  <circle cx="65" cy="62" r="14" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="65" cy="63" r="9.5" fill="#212121"/>
  <circle cx="69" cy="58" r="3" fill="white"/>
  <!-- 右眼（wink，闭合，弯成弧线） -->
  <path d="M90 62 Q97 72 104 62" stroke="#212121" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 眉毛（一边上扬，调皮） -->
  <path d="M48 46 Q57 40 65 44" stroke="#689F38" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M90 44 Q97 40 112 46" stroke="#689F38" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 嘴巴（调皮微笑） -->
  <path d="M68 86 Q80 96 92 86" stroke="#795548" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 小星星闪烁（眨眼特效） -->
  <g transform="translate(125,20)">
    <polygon points="6,0 7.5,4.5 12,4.5 8.5,7.5 10,12 6,9 2,12 3.5,7.5 0,4.5 4.5,4.5" fill="#FFD54F" opacity="0.8"/>
  </g>
</svg>
