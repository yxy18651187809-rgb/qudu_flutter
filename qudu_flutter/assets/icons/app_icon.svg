<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 主背景渐变：温暖的学习感 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#43A047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <!-- 圆形内阴影 -->
    <radialGradient id="innerGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#A5D6A7;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:0" />
    </radialGradient>
    <!-- 书本渐变 -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF9C4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE082;stop-opacity:1" />
    </linearGradient>
    <!-- 书本封面渐变 -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF176;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCA28;stop-opacity:1" />
    </linearGradient>
    <!-- 头部高光 -->
    <radialGradient id="headShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#C5E1A5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8BC34A;stop-opacity:1" />
    </radialGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B5E20" flood-opacity="0.3"/>
    </filter>
    <!-- 书本阴影 -->
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1B5E20" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 外圈白色描边（模拟圆角图标外框） -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- 右上角高光 -->
  <circle cx="256" cy="256" r="240" fill="url(#innerGlow)"/>

  <!-- ==================== 趣趣小书虫 ==================== -->
  <!-- 身体（虫体，椭圆形） -->
  <ellipse cx="256" cy="330" rx="75" ry="55" fill="#7CB342" filter="url(#shadow)"/>

  <!-- 身体条纹（书虫分段） -->
  <path d="M 205 320 Q 256 325 307 320" stroke="#689F38" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 200 340 Q 256 345 312 340" stroke="#689F38" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- 小脚（左侧） -->
  <ellipse cx="192" cy="355" rx="14" ry="8" fill="#689F38" transform="rotate(-20 192 355)"/>
  <ellipse cx="200" cy="375" rx="12" ry="7" fill="#689F38" transform="rotate(-10 200 375)"/>
  <ellipse cx="215" cy="390" rx="11" ry="6" fill="#689F38" transform="rotate(5 215 390)"/>

  <!-- 小脚（右侧） -->
  <ellipse cx="320" cy="355" rx="14" ry="8" fill="#689F38" transform="rotate(20 320 355)"/>
  <ellipse cx="312" cy="375" rx="12" ry="7" fill="#689F38" transform="rotate(10 312 375)"/>
  <ellipse cx="297" cy="390" rx="11" ry="6" fill="#689F38" transform="rotate(-5 297 390)"/>

  <!-- 头部 -->
  <circle cx="256" cy="248" r="72" fill="url(#headShine)" filter="url(#shadow)"/>

  <!-- 触角 -->
  <path d="M 232 190 Q 225 165 215 145" stroke="#558B2F" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="215" cy="143" r="8" fill="#7CB342"/>
  <path d="M 280 190 Q 287 165 297 145" stroke="#558B2F" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="297" cy="143" r="8" fill="#7CB342"/>

  <!-- 眼睛（大而亮） -->
  <ellipse cx="234" cy="232" rx="16" ry="18" fill="#FFF"/>
  <ellipse cx="278" cy="232" rx="16" ry="18" fill="#FFF"/>
  <!-- 瞳孔 -->
  <circle cx="237" cy="235" r="9" fill="#1B5E20"/>
  <circle cx="281" cy="235" r="9" fill="#1B5E20"/>
  <!-- 眼神光 -->
  <circle cx="240" cy="231" r="3.5" fill="#FFF"/>
  <circle cx="284" cy="231" r="3.5" fill="#FFF"/>

  <!-- 腮红 -->
  <ellipse cx="205" cy="258" rx="18" ry="12" fill="#EF9A9A" opacity="0.4"/>
  <ellipse cx="307" cy="258" rx="18" ry="12" fill="#EF9A9A" opacity="0.4"/>

  <!-- 嘴巴（开心微笑） -->
  <path d="M 230 272 Q 256 298 282 272" stroke="#33691E" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- ==================== 书本（趣趣手持） ==================== -->
  <g filter="url(#bookShadow)">
    <!-- 书本底座 -->
    <rect x="196" y="295" width="120" height="88" rx="6" fill="url(#bookGrad)" stroke="#F9A825" stroke-width="2"/>
    <!-- 书脊（中间分割线） -->
    <line x1="256" y1="295" x2="256" y2="383" stroke="#F9A825" stroke-width="2.5"/>
    <!-- 封面装饰（左侧） -->
    <rect x="202" y="302" width="48" height="74" rx="3" fill="url(#bookCover)" opacity="0.8"/>
    <!-- 封面装饰（右侧） -->
    <rect x="262" y="302" width="48" height="74" rx="3" fill="url(#bookCover)" opacity="0.8"/>
    <!-- 左页：汉字示例 -->
    <text x="226" y="336" font-size="20" fill="#33691E" text-anchor="middle" font-family="serif" font-weight="bold">趣</text>
    <text x="226" y="365" font-size="14" fill="#558B2F" text-anchor="middle" font-family="sans-serif">qù</text>
    <!-- 右页：汉字示例 -->
    <text x="286" y="336" font-size="20" fill="#33691E" text-anchor="middle" font-family="serif" font-weight="bold">字</text>
    <text x="286" y="365" font-size="14" fill="#558B2F" text-anchor="middle" font-family="sans-serif">zì</text>
    <!-- 页脚波浪线 -->
    <path d="M 202 378 Q 229 374 256 378 Q 283 382 310 378" stroke="#AED581" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>

  <!-- 书本上方的小星星（学习成就感） -->
  <polygon points="256,155 259,164 268,164 261,170 264,179 256,174 248,179 251,170 244,164 253,164" fill="#FFF176" opacity="0.9"/>
  <polygon points="210,165 212,170 217,170 213,174 215,179 210,176 205,179 207,174 203,170 208,170" fill="#FFF176" opacity="0.7"/>
  <polygon points="302,165 304,170 309,170 305,174 307,179 302,176 297,179 299,174 295,170 300,170" fill="#FFF176" opacity="0.7"/>

  <!-- 左侧光芒线 -->
  <line x1="60" y1="160" x2="80" y2="160" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="65" y1="190" x2="90" y2="190" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="70" y1="220" x2="95" y2="220" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- 右侧光芒线 -->
  <line x1="452" y1="160" x2="432" y2="160" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="447" y1="190" x2="422" y2="190" stroke="#FFF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="442" y1="220" x2="417" y2="220" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
