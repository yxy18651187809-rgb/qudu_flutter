<?xml version="1.0" encoding="UTF-8"?>
<!-- 趣趣 Qùqu - 生气表情 -->
<!-- 使用场景：多次失败、挫折感 -->
<!-- 适配160x210标准viewBox，与系列SVG风格一致 -->
<svg viewBox="0 0 160 210" xmlns="http://www.w3.org/2000/svg">
  <!-- 蒸汽效果 -->
  <g opacity="0.5">
    <path d="M68 25 Q66 16 70 10 Q67 4 70 0" stroke="#B0BEC5" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M80 22 Q82 12 78 6 Q81 0 78 -4" stroke="#B0BEC5" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M92 26 Q90 18 94 12 Q91 6 94 2" stroke="#B0BEC5" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 身体节3（尾部） -->
  <ellipse cx="80" cy="180" rx="22" ry="18" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节2（中部） -->
  <ellipse cx="80" cy="150" rx="28" ry="22" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节1（头部后方） -->
  <ellipse cx="80" cy="116" rx="32" ry="26" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 尾巴（怒气竖起） -->
  <path d="M80 195 Q92 210 82 218 Q72 210 80 195" fill="#A5C487"/>
  <!-- 腹部高光 -->
  <ellipse cx="80" cy="180" rx="12" ry="9" fill="#FFF8E1" opacity="0.85"/>
  <ellipse cx="80" cy="150" rx="17" ry="13" fill="#FFF8E1" opacity="0.85"/>
  <ellipse cx="80" cy="116" rx="20" ry="15" fill="#FFF8E1" opacity="0.85"/>
  <!-- 手（左侧，叉腰） -->
  <circle cx="44" cy="104" r="11" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <path d="M40 114 Q36 100 34 92" stroke="#A5C487" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 手（右侧，叉腰） -->
  <circle cx="116" cy="104" r="11" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <path d="M120 114 Q124 100 126 92" stroke="#A5C487" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 头部（微微倾斜表现怒气） -->
  <ellipse cx="80" cy="68" rx="42" ry="38" fill="#C5E1A5" stroke="#A5C487" stroke-width="2" transform="rotate(-3 80 68)"/>
  <!-- 头顶叶子（僵硬竖起，怒气） -->
  <ellipse cx="80" cy="28" rx="13" ry="20" fill="#8BC34A" stroke="#689F38" stroke-width="1.5" transform="rotate(3 80 28)"/>
  <line x1="80" y1="34" x2="80" y2="50" stroke="#689F38" stroke-width="2"/>
  <!-- 腮红（红色！生气时腮红变红） -->
  <ellipse cx="46" cy="80" rx="14" ry="10" fill="#FF7043" opacity="0.55"/>
  <ellipse cx="114" cy="80" rx="14" ry="10" fill="#FF7043" opacity="0.55"/>
  <!-- 眼睛左 - 怒目圆睁 -->
  <circle cx="63" cy="62" r="14" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="63" cy="63" r="9.5" fill="#212121"/>
  <circle cx="67" cy="58" r="3" fill="white"/>
  <circle cx="60" cy="66" r="1.5" fill="white" opacity="0.5"/>
  <!-- 眼睛右 - 怒目圆睁 -->
  <circle cx="97" cy="62" r="14" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="97" cy="63" r="9.5" fill="#212121"/>
  <circle cx="101" cy="58" r="3" fill="white"/>
  <circle cx="94" cy="66" r="1.5" fill="white" opacity="0.5"/>
  <!-- 眉毛 - 倒八字怒眉（关键生气特征） -->
  <path d="M48 50 Q55 42 72 50" stroke="#689F38" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M88 50 Q105 42 112 50" stroke="#689F38" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 嘴巴 - 撅嘴生气（向下弯） -->
  <path d="M68 90 Q74 84 80 88 Q86 84 92 90" stroke="#795548" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 撅嘴效果 -->
  <ellipse cx="80" cy="87" rx="7" ry="3" fill="#E57373" opacity="0.4"/>
  <!-- 怒气十字纹（左） -->
  <g transform="translate(26, 42)" opacity="0.6">
    <line x1="0" y1="0" x2="7" y2="7" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="0" x2="0" y2="7" stroke="#FF5722" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 怒气十字纹（右） -->
  <g transform="translate(128, 40)" opacity="0.5">
    <line x1="0" y1="0" x2="6" y2="6" stroke="#FF5722" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="6" y1="0" x2="0" y2="6" stroke="#FF5722" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
