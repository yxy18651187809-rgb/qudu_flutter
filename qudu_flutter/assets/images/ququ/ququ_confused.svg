<?xml version="1.0" encoding="UTF-8"?>
<!-- 趣趣 Qùqu - 疑惑表情 -->
<!-- 使用场景：不确定答案、需要思考、遇到陌生字 -->
<svg viewBox="0 0 160 210" xmlns="http://www.w3.org/2000/svg">
  <!-- 身体节3（尾部） -->
  <ellipse cx="80" cy="180" rx="22" ry="18" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节2（中部） -->
  <ellipse cx="80" cy="150" rx="28" ry="22" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节1（头部后方） -->
  <ellipse cx="80" cy="116" rx="32" ry="26" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 尾巴（微微卷起，疑问） -->
  <path d="M80 195 Q90 208 80 218 Q70 208 80 195" fill="#A5C487"/>
  <!-- 腹部高光 -->
  <ellipse cx="80" cy="180" rx="12" ry="9" fill="#FFF8E1" opacity="0.85"/>
  <ellipse cx="80" cy="150" rx="17" ry="13" fill="#FFF8E1" opacity="0.85"/>
  <ellipse cx="80" cy="116" rx="20" ry="15" fill="#FFF8E1" opacity="0.85"/>
  <!-- 手（左侧） -->
  <circle cx="40" cy="112" r="11" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 手（右侧，微微抬起） -->
  <circle cx="122" cy="102" r="11" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 头部（微微歪向一侧） -->
  <ellipse cx="82" cy="68" rx="42" ry="38" fill="#C5E1A5" stroke="#A5C487" stroke-width="2" transform="rotate(5 82 68)"/>
  <!-- 头顶叶子（倾斜，表现歪头疑惑） -->
  <ellipse cx="86" cy="28" rx="13" ry="20" fill="#8BC34A" stroke="#689F38" stroke-width="1.5" transform="rotate(20 86 28)"/>
  <line x1="84" y1="34" x2="82" y2="50" stroke="#689F38" stroke-width="2"/>
  <!-- 腮红（粉色） -->
  <ellipse cx="48" cy="78" rx="12" ry="9" fill="#FFAB91" opacity="0.45"/>
  <ellipse cx="116" cy="78" rx="12" ry="9" fill="#FFAB91" opacity="0.45"/>
  <!-- 眼睛（一大一小，疑惑状） -->
  <!-- 左眼（大眼） -->
  <circle cx="65" cy="64" r="15" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="65" cy="65" r="10" fill="#212121"/>
  <circle cx="69" cy="60" r="3.5" fill="white"/>
  <circle cx="62" cy="68" r="1.5" fill="white" opacity="0.5"/>
  <!-- 右眼（小眼，半闭） -->
  <circle cx="97" cy="65" r="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="97" cy="66" r="7.5" fill="#212121"/>
  <circle cx="100" cy="62" r="2.5" fill="white"/>
  <!-- 眉毛（一侧高一侧低，不对称疑惑） -->
  <path d="M48 48 Q58 40 72 46" stroke="#689F38" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M88 50 Q98 46 108 52" stroke="#689F38" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 嘴巴（微微张开，"嗯？"） -->
  <ellipse cx="84" cy="90" rx="8" ry="5" fill="#795548"/>
  <ellipse cx="84" cy="88" rx="5" ry="2.5" fill="#C5E1A5" opacity="0.3"/>
  <!-- 问号（头顶） -->
  <g transform="translate(118, 10)">
    <text x="0" y="24" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#8BC34A" opacity="0.8">?</text>
  </g>
  <!-- 小问号（更小，浮动） -->
  <g transform="translate(108, 0)" opacity="0.5">
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8BC34A">?</text>
  </g>
</svg>
