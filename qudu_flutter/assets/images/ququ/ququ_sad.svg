<?xml version="1.0" encoding="UTF-8"?>
<!-- 趣趣 Qùqu - 难过表情 -->
<!-- 使用场景：答错题、任务失败、遇到困难 -->
<svg viewBox="0 0 160 210" xmlns="http://www.w3.org/2000/svg">
  <!-- 身体节3（尾部，下垂） -->
  <ellipse cx="80" cy="182" rx="22" ry="18" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节2（中部，微微下垂） -->
  <ellipse cx="80" cy="152" rx="28" ry="22" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节1（头部后方） -->
  <ellipse cx="80" cy="118" rx="32" ry="26" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 尾巴（低垂） -->
  <path d="M80 197 Q88 212 80 220 Q72 212 80 197" fill="#A5C487" opacity="0.8"/>
  <!-- 腹部高光 -->
  <ellipse cx="80" cy="182" rx="12" ry="9" fill="#FFF8E1" opacity="0.85"/>
  <ellipse cx="80" cy="152" rx="17" ry="13" fill="#FFF8E1" opacity="0.85"/>
  <ellipse cx="80" cy="118" rx="20" ry="15" fill="#FFF8E1" opacity="0.85"/>
  <!-- 手（左侧，下垂） -->
  <circle cx="40" cy="118" r="11" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 手（右侧，下垂） -->
  <circle cx="120" cy="118" r="11" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 头部 -->
  <ellipse cx="80" cy="68" rx="42" ry="38" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 头顶叶子（低垂，表现难过） -->
  <ellipse cx="84" cy="32" rx="13" ry="20" fill="#8BC34A" stroke="#689F38" stroke-width="1.5" transform="rotate(25 84 32)"/>
  <line x1="82" y1="38" x2="80" y2="52" stroke="#689F38" stroke-width="2"/>
  <!-- 腮红（淡化） -->
  <ellipse cx="48" cy="80" rx="10" ry="7" fill="#FFAB91" opacity="0.3"/>
  <ellipse cx="112" cy="80" rx="10" ry="7" fill="#FFAB91" opacity="0.3"/>
  <!-- 眼睛（闭合，向下弧线） -->
  <path d="M50 64 Q63 72 76 64" stroke="#212121" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M84 64 Q97 72 110 64" stroke="#212121" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- 眉毛（下垂，表现难过） -->
  <path d="M50 52 Q58 48 70 54" stroke="#689F38" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M90 54 Q102 48 110 52" stroke="#689F38" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 嘴巴（小波浪线，难过的嘴） -->
  <path d="M68 90 Q74 86 80 90 Q86 94 92 90" stroke="#795548" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 大泪滴（左侧） -->
  <path d="M52 72 Q48 82 52 88 Q58 88 58 82 Z" fill="#64B5F6" opacity="0.7"/>
  <ellipse cx="54" cy="82" rx="2.5" ry="2" fill="white" opacity="0.6"/>
  <!-- 小泪滴（右侧） -->
  <path d="M102 68 Q99 76 102 82 Q107 82 107 76 Z" fill="#64B5F6" opacity="0.6"/>
  <ellipse cx="104" cy="76" rx="2" ry="1.5" fill="white" opacity="0.5"/>
</svg>
