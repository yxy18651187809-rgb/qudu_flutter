<?xml version="1.0" encoding="UTF-8"?>
<!-- 趣趣 Qùqu - 睡觉表情 -->
<!-- 使用场景：休息提醒、晚安模式、加载等待 -->
<svg viewBox="0 0 160 210" xmlns="http://www.w3.org/2000/svg">
  <!-- 身体节3（蜷缩） -->
  <ellipse cx="80" cy="185" rx="20" ry="16" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节2（蜷缩） -->
  <ellipse cx="80" cy="158" rx="26" ry="20" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 身体节1（蜷缩，侧身） -->
  <ellipse cx="82" cy="130" rx="30" ry="24" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 尾巴（垂下） -->
  <path d="M82 199 Q72 212 82 218" stroke="#A5C487" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 腹部高光（睡眠时朦胧感） -->
  <ellipse cx="82" cy="185" rx="11" ry="8" fill="#FFF8E1" opacity="0.7"/>
  <ellipse cx="82" cy="158" rx="15" ry="12" fill="#FFF8E1" opacity="0.7"/>
  <ellipse cx="82" cy="130" rx="18" ry="14" fill="#FFF8E1" opacity="0.7"/>
  <!-- 手（蜷缩，放在身体旁） -->
  <circle cx="56" cy="134" r="10" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <circle cx="108" cy="134" r="10" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 书（放在一边，睡觉时不看书记） -->
  <rect x="115" y="140" width="24" height="18" rx="3" fill="#FF8A65" stroke="#E64A19" stroke-width="1.5" opacity="0.5"/>
  <line x1="127" y1="140" x2="127" y2="158" stroke="#E64A19" stroke-width="1.5"/>
  <!-- 头部（侧身，睡觉状） -->
  <ellipse cx="82" cy="96" rx="38" ry="34" fill="#C5E1A5" stroke="#A5C487" stroke-width="2"/>
  <!-- 头顶叶子（垂下） -->
  <ellipse cx="82" cy="62" rx="12" ry="18" fill="#8BC34A" stroke="#689F38" stroke-width="1.5" transform="rotate(25,82,62)"/>
  <line x1="82" y1="68" x2="82" y2="80" stroke="#689F38" stroke-width="2" transform="rotate(25,82,68)"/>
  <!-- 腮红（淡粉色，朦胧感） -->
  <ellipse cx="54" cy="100" rx="12" ry="9" fill="#FFAB91" opacity="0.4"/>
  <ellipse cx="110" cy="100" rx="12" ry="9" fill="#FFAB91" opacity="0.4"/>
  <!-- 眼睛（闭合，～～形） -->
  <path d="M50 92 Q57 88 64 92" stroke="#212121" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M100 92 Q107 88 114 92" stroke="#212121" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 眉毛（放松，自然下垂） -->
  <path d="M50 80 Q57 78 64 80" stroke="#689F38" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M100 80 Q107 78 114 80" stroke="#689F38" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 嘴巴（小波浪线～～） -->
  <path d="M68 106 Q74 110 80 106 Q86 102 92 106" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Zzz 飘出（睡觉特效） -->
  <text x="115" y="75" font-size="14" fill="#8BC34A" opacity="0.7" font-family="Arial">Z</text>
  <text x="125" y="60" font-size="16" fill="#8BC34A" opacity="0.5" font-family="Arial">Z</text>
  <text x="136" y="45" font-size="18" fill="#8BC34A" opacity="0.3" font-family="Arial">Z</text>
</svg>
