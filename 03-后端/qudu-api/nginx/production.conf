# ============================================================
# 字趣阅读 - 生产环境 Nginx 反向代理配置
# 适用：HTTPS + 静态资源 + API 反向代理
# 维护：后端负责人
# 更新：2026-06-13
# ============================================================

# 上游后端服务（Node.js PM2集群）
upstream qudu_api {
    least_conn;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    # 如需多进程：server 127.0.0.1:3002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# 上游前端服务（Flutter Web / 静态站点）
upstream qudu_frontend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# ============================================================
# HTTP → HTTPS 强制跳转
# ============================================================
server {
    listen 80;
    server_name api.ziqu.com;
    
    # Let's Encrypt ACME 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS API 服务
# ============================================================
server {
    listen 443 ssl http2;
    server_name api.ziqu.com;

    # --- SSL 证书（Let's Encrypt / 阿里云免费证书 / 腾讯云SSL）---
    # 方案A: Let's Encrypt（免费，自动续期）
    ssl_certificate     /etc/letsencrypt/live/api.ziqu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ziqu.com/privkey.pem;
    
    # 方案B: 阿里云/腾讯云免费SSL（手动续期，1年有效）
    # ssl_certificate     /etc/ssl/api.ziqu.com.pem;
    # ssl_certificate_key /etc/ssl/api.ziqu.com.key;

    # SSL 安全配置（Mozilla Intermediate）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # HSTS（强制HTTPS，首次部署时注释掉，确认正常后再开启）
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # --- 基础安全头 ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 请求体大小限制 ---
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # --- Gzip 压缩 ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # --- 访问日志 ---
    access_log /var/log/nginx/qudu_api_access.log;
    error_log  /var/log/nginx/qudu_api_error.log;

    # ============================================================
    # API 反向代理
    # ============================================================
    location /api/ {
        proxy_pass http://qudu_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # ============================================================
    # 静态资源（绘本图片、音频文件）
    # ============================================================
    location /uploads/ {
        alias /opt/qudu-api/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # 安全：禁止执行
        location ~* \.(php|py|sh|bash)$ {
            deny all;
            return 403;
        }
    }

    location /audio/ {
        alias /opt/qudu-api/uploads/audio/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Accept-Ranges bytes;
    }

    # ============================================================
    # Swagger API 文档（仅内网/白名单IP可访问）
    # ============================================================
    location /api-docs {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://qudu_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================================
    # 健康检查端点（不记日志，无缓冲）
    # ============================================================
    location /api/v1/ping {
        proxy_pass http://qudu_api;
        proxy_set_header Host $host;
        access_log off;
        proxy_buffering off;
    }
}

